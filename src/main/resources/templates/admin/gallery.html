<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio | JM Admin</title><link rel="stylesheet" href="/css/style.css?v=6"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/">JM<span>PHOTOGRAPHY</span></a><p class="eyebrow">ADMIN STUDIO</p><a href="/admin">Overview</a><a href="/admin/products">Products</a><a class="active" href="/admin/gallery">Portfolio</a><a href="/admin/enquiries">Enquiries</a><a href="/">View website ↗</a><form th:action="@{/admin/logout}" method="post"><button class="side-logout">Sign out</button></form></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">VISUAL STORIES</p><h1>Portfolio</h1></div><a class="btn gold" href="/admin/gallery/new">+ Add item</a></div><div class="table-wrap admin-panel"><table><thead><tr><th>Title</th><th>Category</th><th>Image URL</th><th>Action</th></tr></thead><tbody><tr th:each="g : ${gallery}"><td th:text="${g.title}"></td><td th:text="${g.category}"></td><td class="url-cell" th:text="${g.imageUrl}"></td><td><form th:action="@{/admin/gallery/delete/{id}(id=${g.id})}" method="post" onsubmit="return confirm('Delete this portfolio item?')"><button class="danger-link">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(gallery)}"><td colspan="4">No portfolio items yet.</td></tr></tbody></table></div></main></div></body></html>
