<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | JM Admin</title><link rel="stylesheet" href="/css/style.css?v=6"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/">JM<span>PHOTOGRAPHY</span></a><p class="eyebrow">ADMIN STUDIO</p><a href="/admin">Overview</a><a class="active" href="/admin/products">Products</a><a href="/admin/gallery">Portfolio</a><a href="/admin/enquiries">Enquiries</a><a href="/">View website ↗</a><form th:action="@{/admin/logout}" method="post"><button class="side-logout">Sign out</button></form></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>Products</h1></div><a class="btn gold" href="/admin/products/new">+ Add product</a></div><p class="success" th:if="${param.saved}">Product saved successfully.</p><p class="success" th:if="${param.deleted}">Product deleted.</p><div class="table-wrap admin-panel"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Featured</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${products}"><td th:text="${p.name}"></td><td th:text="${p.category}"></td><td th:text="${p.price != null ? '₹' + p.price : 'On request'}"></td><td th:text="${p.featured ? 'Yes' : 'No'}"></td><td class="actions-cell"><a th:href="@{/admin/products/edit/{id}(id=${p.id})}">Edit</a><form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Delete this product?')"><button>Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="5">No products yet. Add your first product.</td></tr></tbody></table></div></main></div></body></html>
