<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiries | JM Admin</title><link rel="stylesheet" href="/css/style.css?v=6"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="brand" href="/">JM<span>PHOTOGRAPHY</span></a><p class="eyebrow">ADMIN STUDIO</p><a href="/admin">Overview</a><a href="/admin/products">Products</a><a href="/admin/gallery">Portfolio</a><a class="active" href="/admin/enquiries">Enquiries</a><a href="/">View website ↗</a><form th:action="@{/admin/logout}" method="post"><button class="side-logout">Sign out</button></form></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">CUSTOMER RELATIONSHIPS</p><h1>Enquiries</h1></div></div><div class="table-wrap admin-panel"><table><thead><tr><th>Customer</th><th>Contact</th><th>Event</th><th>Date</th><th>Message</th><th>Status</th></tr></thead><tbody><tr th:each="q : ${enquiries}"><td th:text="${q.name}"></td><td><span th:text="${q.phone}"></span><br><small th:text="${q.email}"></small></td><td th:text="${q.eventType}"></td><td th:text="${q.eventDate}"></td><td th:text="${q.message}"></td><td><form th:action="@{/admin/enquiries/status/{id}(id=${q.id})}" method="post"><select name="status" onchange="this.form.submit()"><option th:selected="${q.status == 'NEW'}">NEW</option><option th:selected="${q.status == 'CONTACTED'}">CONTACTED</option><option th:selected="${q.status == 'BOOKED'}">BOOKED</option><option th:selected="${q.status == 'CLOSED'}">CLOSED</option></select></form></td></tr><tr th:if="${#lists.isEmpty(enquiries)}"><td colspan="6">No customer enquiries yet.</td></tr></tbody></table></div></main></div></body></html>
