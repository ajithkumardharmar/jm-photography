<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product form | JM Admin</title><link rel="stylesheet" href="/css/style.css?v=6"></head><body class="admin-body"><main class="form-page"><a class="under-link" href="/admin/products">← Back to products</a><p class="eyebrow">CATALOGUE</p><h1 th:text="${product.id == null ? 'Add a product' : 'Edit product'}">Product</h1><form class="contact-form admin-form" th:action="@{/admin/products/save}" th:object="${product}" method="post"><input type="hidden" th:field="*{id}"><label>Product name<input th:field="*{name}" required maxlength="120" placeholder="Premium wedding album"></label><label>Category<select th:field="*{category}" required><option value="">Choose category</option><option>Premium Album</option><option>Photo Frame</option><option>LED Frame</option><option>Flex Design</option><option>Litho Design</option><option>Other</option></select></label><label>Description<textarea th:field="*{description}" rows="4"></textarea></label><label>Price (INR)<input type="number" min="0" step="0.01" th:field="*{price}" placeholder="Leave blank for quote"></label><label>Image URL<input type="url" th:field="*{imageUrl}" placeholder="https://..." ></label><label class="check-label"><input type="checkbox" th:field="*{featured}"> Show as featured on website</label><button class="btn gold" type="submit">Save product ↗</button></form></main></body></html>
